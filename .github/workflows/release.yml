name: release
# janis for Linux as one file: ggml's CPU kernels linked in (scripts/fetch-ggml.sh
# --static), the tokenizer library too. A tag v* publishes it as a release asset;
# a CI job downloads the file and runs it, nothing to install beside it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: amd64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          bash scripts/fetch-ggml.sh --static
          bash scripts/build-tokenizer.sh
          go build -tags ggml -trimpath -ldflags "-s -w" -o janis-linux-${{ matrix.arch }} ./cmd/janis
          ls -la janis-linux-${{ matrix.arch }}; ldd janis-linux-${{ matrix.arch }}
      - name: Smoke test (Qwen3-0.6B, one answer)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cp janis-linux-${{ matrix.arch }} "$RUNNER_TEMP/bin/janis" && cd "$RUNNER_TEMP"
          ./bin/janis pull Qwen3-0.6B-4bit
          JANIS_BACKEND=ggml nohup ./bin/janis serve --model Qwen3-0.6B-4bit > janis.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8090/v1/models >/dev/null && break; sleep 1; done
          out=$(curl -s --max-time 300 http://127.0.0.1:8090/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"Qwen3-0.6B-4bit","messages":[{"role":"user","content":"What is 2+3? Answer with the number."}],"max_tokens":8,"temperature":0}' || true)
          echo "$out"; tail -40 janis.log; grep -o -m1 -E "asimddp|i8mm|sve" /proc/cpuinfo | sort -u | tr "\n" " "
          echo "$out" | grep -q '"content":"[^"]*5' || { echo "no 5 in the answer" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: janis-linux-${{ matrix.arch }}
          path: janis-linux-${{ matrix.arch }}
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "janis for Linux, one file: janis-linux-amd64, janis-linux-arm64." || true
          gh release upload "$GITHUB_REF_NAME" janis-linux-${{ matrix.arch }} --clobber
