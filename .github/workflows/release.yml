name: release
# janis as a user gets it, built by `make dist` on each runner: Linux as one
# file (ggml's CPU kernels and the tokenizer linked in), macOS as an archive
# of the binary with the MLX libraries it loads. A tag v* publishes them as
# release assets; a CI job downloads one and runs it, nothing to install
# beside it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, asset: janis-linux-amd64 }
          - { os: ubuntu-22.04-arm, asset: janis-linux-arm64 }
          - { os: macos-15, asset: janis-darwin-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: MLX from Homebrew (macOS)
        if: runner.os == 'macOS'
        run: brew install mlx mlx-c
      - name: make dist
        # A tag stamps itself as the version (janis version, GET /health).
        run: make dist ${{ startsWith(github.ref, 'refs/tags/v') && format('VERSION={0}', github.ref_name) || '' }}
      - name: make dist-check (Qwen3-0.6B-4bit, one answer)
        run: make dist-check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "janis for Linux and macOS (Apple silicon): curl -fsSL https://github.com/guregodevo/janis/releases/latest/download/install.sh | sh" || true
          files="dist/${{ matrix.asset }} dist/${{ matrix.asset }}.sha256"
          # install.sh once: two jobs uploading it race (422, already exists).
          [ "${{ matrix.asset }}" = janis-linux-amd64 ] && files="$files install.sh"
          gh release upload "$GITHUB_REF_NAME" $files --clobber

  # The release as a user gets it, on each OS: install.sh from the release
  # just made, then one answer.
  install:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh, serve --detach, one answer
        run: |
          curl -fsSL "https://github.com/guregodevo/janis/releases/download/$GITHUB_REF_NAME/install.sh" | JANIS_VERSION="$GITHUB_REF_NAME" sh
          bash scripts/smoke.sh "$HOME/.local/bin/janis"
