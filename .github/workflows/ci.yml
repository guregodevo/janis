# The tests of every pull request: the pure-Go build, since the ggml and
# tokenizer libraries (scripts/fetch-ggml.sh) are not on the runner.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
